<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2219"/>
      <stop offset="50%" stop-color="#141916"/>
      <stop offset="100%" stop-color="#080b0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base (Transparent / Clean) -->
  <rect width="128" height="128" rx="28" fill="#060a08"/>

  <!-- Card Body -->
  <g transform="translate(18, 14) rotate(-5, 46, 50)" filter="url(#cardGlow)">
    <rect x="8" y="4" width="76" height="100" rx="10" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Inner Fine Border -->
    <rect x="13" y="9" width="66" height="90" rx="7" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Corner Diamonds -->
    <polygon points="17,14 19,16 17,18 15,16" fill="#f59e0b"/>
    <polygon points="75,14 77,16 75,18 73,16" fill="#f59e0b"/>
    <polygon points="17,92 19,94 17,96 15,94" fill="#f59e0b"/>
    <polygon points="75,92 77,94 75,96 73,94" fill="#f59e0b"/>

    <!-- Central Plaque with DING -->
    <rect x="19" y="38" width="54" height="28" rx="6" fill="#090d0b" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <text x="46" y="58" font-family="'Chakra Petch', 'Rajdhani', sans-serif" font-weight="900" font-size="16" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">DING</text>
  </g>
</svg>
